<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="og-card-title og-card-desc">
  <title id="og-card-title">LSEAT</title>
  <desc id="og-card-desc">Relax and enjoy flying economy. Reinventing comfort in economy class.</desc>

  <defs>
    <linearGradient id="og-accent" x1="20" y1="8" x2="50" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00D2FE" />
      <stop offset="1" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="og-rule" x1="80" y1="0" x2="1120" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00D2FE" stop-opacity="0.9" />
      <stop offset="0.55" stop-color="#0284C7" stop-opacity="0.5" />
      <stop offset="1" stop-color="#0284C7" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="og-wordmark" x1="80" y1="0" x2="470" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.5" />
    </linearGradient>
    <radialGradient id="og-horizon-glow" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#00D2FE" stop-opacity="0.28" />
      <stop offset="0.55" stop-color="#0284C7" stop-opacity="0.12" />
      <stop offset="1" stop-color="#0B192C" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="og-corner-glow" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#0284C7" stop-opacity="0.3" />
      <stop offset="1" stop-color="#0B192C" stop-opacity="0" />
    </radialGradient>
    <pattern id="og-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#0B192C" />
  <rect width="1200" height="630" fill="url(#og-grid)" />
  <ellipse cx="640" cy="440" rx="720" ry="210" fill="url(#og-horizon-glow)" />
  <ellipse cx="1180" cy="40" rx="420" ry="300" fill="url(#og-corner-glow)" />
  <line x1="80" y1="386" x2="1120" y2="386" stroke="url(#og-rule)" stroke-width="2" />

  <g transform="translate(80,58) scale(1.6)">
    <path d="M20 40 L34 8 L50 8 L36 40 Z" fill="url(#og-accent)" />
    <path d="M20 40 L24.4 32 L40.4 32 L36 40 Z" fill="#FFFFFF" fill-opacity="0.9" />
    <text x="58" y="33" fill="#FFFFFF" font-family="'Plus Jakarta Sans', Inter, 'Segoe UI', Arial, system-ui, sans-serif" font-size="22" font-weight="800" letter-spacing="2">LSEAT</text>
    <rect x="58" y="37" width="86" height="2" rx="1" fill="#00D2FE" fill-opacity="0.55" />
  </g>

  <text x="80" y="228" fill="#FFFFFF" font-family="'Plus Jakarta Sans', Inter, 'Segoe UI', Arial, system-ui, sans-serif" font-size="52" font-weight="800" letter-spacing="-0.5">REINVENTING COMFORT</text>
  <text x="80" y="292" fill="#FFFFFF" font-family="'Plus Jakarta Sans', Inter, 'Segoe UI', Arial, system-ui, sans-serif" font-size="52" font-weight="800" letter-spacing="-0.5">IN ECONOMY CLASS</text>

  <rect x="80" y="330" width="56" height="4" rx="2" fill="#00D2FE" />
  <text x="152" y="340" fill="#00D2FE" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="20" font-weight="500" letter-spacing="0.5">Relax and enjoy flying economy</text>

  <g font-family="'Plus Jakarta Sans', Inter, 'Segoe UI', Arial, system-ui, sans-serif">
    <line x1="318" y1="446" x2="318" y2="534" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1" />
    <line x1="596" y1="446" x2="596" y2="534" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1" />
    <line x1="874" y1="446" x2="874" y2="534" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1" />

    <text x="80" y="486" fill="#00D2FE" font-size="22" font-weight="700">1650 grams</text>
    <text x="80" y="522" fill="#FFFFFF" fill-opacity="0.5" font-size="13" font-weight="500" letter-spacing="1.2">KIT WEIGHT</text>

    <text x="358" y="486" fill="#00D2FE" font-size="22" font-weight="700">less than 15 minutes</text>
    <text x="358" y="522" fill="#FFFFFF" fill-opacity="0.5" font-size="13" font-weight="500" letter-spacing="1.2">INSTALLATION TIME</text>

    <text x="636" y="486" fill="#00D2FE" font-size="22" font-weight="700">no A.O.G time</text>
    <text x="636" y="522" fill="#FFFFFF" fill-opacity="0.5" font-size="13" font-weight="500" letter-spacing="1.2">A.O.G</text>

    <text x="914" y="486" fill="#00D2FE" font-size="22" font-weight="700">16G compliance</text>
    <text x="914" y="522" fill="#FFFFFF" fill-opacity="0.5" font-size="13" font-weight="500" letter-spacing="1.2">A SPRING SYSTEM</text>
  </g>

  <line x1="80" y1="562" x2="1120" y2="562" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1" />
  <text x="80" y="596" fill="#FFFFFF" fill-opacity="0.45" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="14" font-weight="500" letter-spacing="0.5">Full compliance with FAA and EASA regulations</text>
  <text x="1120" y="596" text-anchor="end" fill="#00D2FE" font-family="'Plus Jakarta Sans', Inter, 'Segoe UI', Arial, system-ui, sans-serif" font-size="20" font-weight="700" letter-spacing="1">lseat.eu</text>
</svg>
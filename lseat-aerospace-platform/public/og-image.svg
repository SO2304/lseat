  <title id="og-card-title">LSEAT Aerospace - Economy Seat Sleep Mode 16G</title>
  <desc id="og-card-desc">Open Graph card 1200x630: ergonomic passenger sleep-mode conversion kit for aircraft cabins. EASA Part 21J, FAA Part 21, and a rental model with no upfront investment. Under 1,650 g for a 3-seat block, under 15 min per seat, 0 h A.O.G., 16G CS-25 / FAR-25. lseat.eu</desc>


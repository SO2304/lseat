<?xml version="1.0" encoding="UTF-8"?>
<!--
  RECONSTRUCTION of the LSEAT mark from brochure artwork. Replace this file with the
  official vendor vector to guarantee brand fidelity - no component changes required.

  Lockup: blue rounded geometric "L" (real path, stroke-based so it renders identically
  everywhere), a vivid red angular swoosh/arrow sweeping behind and to the right of the
  L, and the "SEAT" wordmark in a near-black sans to the right of the L.
  Background is transparent on purpose: the official white plate is added in Header.astro
  and Footer.astro, not baked into the file.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 208 52" width="208" height="52" role="img">
  <title>LSEAT Aerospace</title>
  <desc>LSEAT Aerospace brand mark: a blue rounded letter L with a red angular swoosh sweeping behind it, followed by the word SEAT in dark capitals.</desc>

  <!-- Red angular swoosh / arrow, drawn first so the blue L sits on top of it -->
  <g fill="#E2231A">
    <path d="M 17 39 L 30 28 L 50 15 L 50 22 L 30 34 Z" />
    <path d="M 72 6 L 55 30 L 44 12 Z" />
  </g>

  <!-- Blue rounded geometric L -->
  <path
    d="M 22 15 V 41 H 48"
    fill="none"
    stroke="#1E5FA8"
    stroke-width="13"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!--
    SEAT wordmark. NOTE: this is a <text> element with a generic font stack, so its exact
    letterforms depend on the font available at render time. For a production lockup the
    vendor vector (outlined paths) must replace this element; the viewBox and intrinsic
    dimensions stay the same, so no component markup has to change.
  -->
  <text
    x="80"
    y="40"
    fill="#111827"
    font-family="Helvetica, Arial, sans-serif"
    font-size="34"
    font-weight="700"
    letter-spacing="6"
  >SEAT</text>
</svg>
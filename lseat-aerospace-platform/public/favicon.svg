<?xml version="1.0" encoding="UTF-8"?>
<!-- LSEAT favicon: mark-only adaptation of logo.svg. The "SEAT" wordmark is
     deliberately OMITTED (illegible at 16/32px) - only the blue L and red swoosh
     remain. Geometry and colours copied verbatim; the group is translated (NOT
     scaled) into a 64x64 square viewBox so the L+swoosh aspect ratio is preserved
     exactly with an even margin. Colours are hardcoded: a favicon renders outside
     the page's CSS, where an inherited colour keyword resolves to nothing. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="32" height="32" role="img">
  <title>LSEAT</title>
  <g transform="translate(-11.75 5.25)">
    <g fill="#E2231A">
      <path d="M 17 39 L 30 28 L 50 15 L 50 22 L 30 34 Z"/>
      <path d="M 72 6 L 55 30 L 44 12 Z"/>
    </g>
    <path d="M 22 15 V 41 H 48" fill="none" stroke="#1E5FA8" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>